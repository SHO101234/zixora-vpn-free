name: Build zixora VPN APK

# Builds automatically when you push to master/main, or manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    # The two native submodules are cloned explicitly because this fork was
    # created by uploading files (no git submodule metadata in the repo).
    # hev-socks5-tunnel has its own nested submodules, so --recurse-submodules
    # is required; both repos are pinned to the same commits upstream uses.
    - name: Clone hev-socks5-tunnel sources
      run: |
        rm -rf hev-socks5-tunnel
        git clone --recurse-submodules https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel
        git -C hev-socks5-tunnel checkout d9dca26c7ad0e494492244f0309e80ee583e739e
        git -C hev-socks5-tunnel submodule update --init --recursive

    - name: Clone AndroidLibXrayLite sources
      run: |
        rm -rf AndroidLibXrayLite
        git clone https://github.com/2dust/AndroidLibXrayLite.git AndroidLibXrayLite
        git -C AndroidLibXrayLite checkout ea96a7f9c33d6e18021386db96bf95680e853c93
        git -C AndroidLibXrayLite fetch --tags --force

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current core tag: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray core
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build debug APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreDebug

    - name: Upload APKs
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: zixora-vpn-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
